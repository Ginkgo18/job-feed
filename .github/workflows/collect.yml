name: Collect jobs hourly
on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: ["collect.py", "config/**", ".github/workflows/collect.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fast
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py fast
      - name: Save results
        run: |
          git config user.name "job-feed-bot"
          git config user.email "job-feed-bot@users.noreply.github.com"
          git add feed
          git commit -m "Update job feed (fast)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
