name: Collect Workday jobs twice a day
on:
  schedule:
    - cron: "10 12 * * *"
    - cron: "10 18 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/collect-workday.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: workday
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py workday
      - name: Save results
        run: |
          git config user.name "job-feed-bot"
          git config user.email "job-feed-bot@users.noreply.github.com"
          git add feed
          git commit -m "Update job feed (workday)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
